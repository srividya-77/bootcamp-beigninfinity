<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeingInfinity - Auto Suggest</title>
    <style>
        #main {
            border: 1px solid rgba(116, 12, 12, 0.267); 
            border-radius: 16px; 
            padding: 10px 10px 10px 18px;
            text-align: center; 
            margin: 20px;
            font-family: Arial, sans-serif;
        }
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-left: 10px;
            margin-right: 10px;
            padding: 0px 10px 10px 10px;
        }
        #tagline {
            color: darkgray;
        }
        #search-container {
            display: flex;
            align-items: center;
            width: 50%;
            margin: 0 auto;
            padding: 0 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            background: white;
        }
        #search {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
        }
        #search-icon {
            margin-right: 8px;
            font-size: 16px;
        }
        #suggestions-box {
            width: 50%;
            margin: 10px auto 0 auto;
            border-radius: 10px;
            border: 1px solid #ccc;
            background: white;
            text-align: left; /* Changed to left for cleaner suggestion list alignment */
            max-height: 300px;
            overflow-y: auto;
            display: none; /* Hidden by default, shown when there are suggestions */
        }
        #suggestions-box p.placeholder {
            text-align: center;
            color: gray;
            padding: 10px;
            margin: 0;
        }
        .suggestion-item {
            padding: 10px 15px;
            margin: 0;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            font-size: 15px;
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
        .suggestion-item:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
<div id="main">
    <div id="header">
        <p id="gear">&#9881;</p>
        <p id="online">&#8226;online &#x1F550;clock</p>
    </div>
    <h1>Being<span style="color: #e3b341;">Infinity</span></h1>
    <p id="tagline">One Million phrases. Four algorithms. Prefix based Auto suggest</p>
    <br>
    <div id="search-container">
        <span id="search-icon">&#128269;</span>
        <input type="text" id="search" placeholder="start typing" autocomplete="off">
    </div>
    <div id="suggestions-box">
        <p class="placeholder">Suggestions will appear here...</p>
    </div>
</div>
<script>
    const suggestionsBox = document.getElementById('suggestions-box');
    const searchInput = document.getElementById('search');

    function getSuggestionsFromResponse(data) {
        // The API sometimes returns an array directly or an object with suggestions
        if (Array.isArray(data)) return data;
        return data?.results || data?.suggestions || [];
    }

    function renderSuggestions(suggestions, query) {
        suggestionsBox.innerHTML = '';

        if (!suggestions || suggestions.length === 0) {
            suggestionsBox.innerHTML = '<p class="placeholder">No suggestions found</p>';
            return;
        }

        suggestions.forEach((item) => {
            const text = typeof item === 'string' ? item : (item.text ?? item.phrase ?? JSON.stringify(item));

            const div = document.createElement('div');
            div.className = 'suggestion-item';
            div.textContent = text;

            div.addEventListener('click', () => {
                searchInput.value = text;
                suggestionsBox.style.display = 'none';
            });

            suggestionsBox.appendChild(div);
        });

        suggestionsBox.style.display = 'block';
    }

    let debounceTimer = null;

    searchInput.addEventListener('input', () => {
        const query = searchInput.value.trim();

        if (query.length === 0) {
            suggestionsBox.innerHTML = '<p class="placeholder">Suggestions will appear here...</p>';
            suggestionsBox.style.display = 'none';
            return;
        }

        // Debounce API calls
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(async () => {
            try {
                const url = `https://autosuggest-backend.onrender.com/api/autosuggest?q=${encodeURIComponent(query)}&algorithm=brute&limit=10&weighted=false`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Request failed: ${response.status}`);
                }

                const data = await response.json();
                const suggestions = getSuggestionsFromResponse(data);
                renderSuggestions(suggestions, query);

            } catch (err) {
                console.error('Error fetching suggestions:', err);
                suggestionsBox.style.display = 'block';
                suggestionsBox.innerHTML = '<p class="placeholder" style="color: red;">Failed to load suggestions</p>';
            }
        }, 250);
    });

    // Close suggestions if user clicks outside
    document.addEventListener('click', (e) => {
        const isClickInside = searchInput.contains(e.target) || suggestionsBox.contains(e.target);
        if (!isClickInside) suggestionsBox.style.display = 'none';
    });
</script>
