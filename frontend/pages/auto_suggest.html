<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main {
         border: 1px solid rgba(116, 12, 12, 0.267); border-radius: 16px; padding: 10px 10px 10px 18px;
         text-align: center; margin: 20px;
        }
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-left: 10px;
            margin-right: 10px;
            padding: 0px 10px 10px 10px;
        }
        #tagline{
            color:darkgray
        }
        #search-container {
            display: flex;
            align-items: center;
            width: 50%;
            margin: 0 auto;
            padding: 0 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            background: white;
        }
        #search {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
        }
        #search-icon {
            margin-right: 8px;
            font-size: 16px;
        }
        #suggestions-box{
            width: 50%;
            margin: 0 auto;
            border-radius: 10px;
            border: 1px solid #ccc;
            background: white;
            text-align: center;
        }
    </style>
</head>
<body><div id="main">
    <div id = "header">
    <p id ="gear">&#9881;</p>
    <p id ="online">&#8226;online &#x1F550;clock</p>
   </div>
    <h1>Being<span style="color: #e3b341;">Infinity</span></h1>
    <p id ="tagline"> One Million phrases.Four algorithms.Prefix based Auto suggest</p>
    <br>
    <div id="search-container">
        <span id="search-icon">&#128269;</span>
        <input type="text" id="search" placeholder="start typing">
    </div>
    <div id="suggestions-box">
        <p>Suggestions will appear here...</p>
    </div>
    
</div>  
</body>
</html>
